env: live
candle_timeframe: 15minute
capital:
  total: 100000
  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 7
risk:
  gtt_enabled: true
  order_type: limit          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 10
  default_sl_pct: 3
  risk_reward: 2.5
  max_capital_per_stock_pct: 10.0
interested:
- NSE:ATHERENERG


watchlist:
- NSE:ATHERENERG
- NSE:SUZLON
- NSE:ENGINERSIN
- NSE:GODIGIT
- NSE:INFOMEDIA
- NSE:THYROCARE


strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 400
    threshold: 0.90
    profit_pct: 10.0
    stop_pct: 5
    hold_bars: 200
    retrain_every: 50
    extrema_order: 5

data:
  db_path: data/market.db
  historical_cache_days: 50
logging:
  level: INFO
  dir: logs/
ui:
  enabled: true
  port: 8080
