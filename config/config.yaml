env: live
candle_timeframe: 15minute
capital:
  total: 50000 
  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 10
risk:
  gtt_enabled: false
  order_type: market          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 20
  compounding: true            # true → per-stock cap scales with base_capital + strategy cumulative P&L
  default_sl_pct: 3
  risk_reward: 2.5
  max_capital_per_stock_pct: 15.0
  trading_start: "09:30"      # no ENTRY signals accepted before this time (IST)
  trading_end: "15:30"        # no ENTRY signals accepted after this time (IST)
interested:
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL


watchlist:
  - NSE:ATHERENERG
  - NSE:CUPID
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL
  - NSE:GUJALKALI

  - NSE:NATIONALUM     # +₹8.9k, 16t — aluminium
  - NSE:TVSMOTOR       # +₹8.6k, 11t — motorcycles / EVs
  - NSE:FEDERALBNK     # +₹7.0k, 15t — mid-cap bank
  - NSE:BLUESTARCO     # +₹5.4k, 13t — HVAC
  - NSE:RADICO         # +₹5.2k, 15t — spirits
  - NSE:RVNL           # +₹4.4k, 22t — rail infra
  - NSE:M&MFIN         # +₹4.3k, 17t — auto finance
  - NSE:SOLARINDS      # +₹3.3k, 13t — explosives / defence
  - NSE:CGPOWER        # +₹3.2k, 10t — transformers
  - NSE:INDUSTOWER     # +₹3.1k, 13t — telecom towers
  - NSE:MFSL           # +₹3.1k, 14t — insurance
  - NSE:MARICO         # +₹2.9k, 14t — FMCG
  - NSE:ASHOKLEY       # +₹2.8k, 16t — commercial vehicles
  - NSE:HAL            # +₹2.0k,  8t — aerospace / defence
  - NSE:LTF            # +₹1.7k, 10t — NBFC
  - NSE:GAIL           # +₹1.0k, 12t — gas distribution
  - NSE:RECLTD         # +₹656,  10t — power finance
  - NSE:MCX            # +₹390,  26t — commodity exchange
  # --- Borderline (few trades, positive — keep for live monitoring) ---
  - NSE:DIXON          # +₹236,   4t — electronics manufacturing




strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 300
    lookback_bars: 1200
    threshold: 0.90
    profit_pct: 10
    trail_pct: 2.5
    sell_min_pct: 3.0
    sell_threshold: 0.85
    min_hold_before_exit: 1
    stop_pct: 20
    hold_bars: 200
    retrain_every: 25
    extrema_order: 10
    veto_threshold: 1.0
    volume_ma_bars: 20
    entry_min_volume_ratio: 0  # e.g. 1.3 — block if volume < 1.3x average
    entry_min_norm_price: 0.0     # e.g. 0.5 — block if close in lower half of candle range
    entry_require_prior_decline: false  # true — block if 20-bar return slope is flat/rising
    force_trailing_close_time: "15:25"
    # RSI gate (disabled by default)
    rsi_gate_enabled: false
    rsi_period: 14
    rsi_gate_max: 30.0           # RSI must be <= this to allow entry
    # Stochastic RSI gate (disabled by default)
    stoch_rsi_gate_enabled: false
    stoch_rsi_period: 14         # used for both RSI calc and stochastic lookback
    stoch_rsi_smooth_k: 3        # K-line smoothing
    stoch_rsi_gate_max: 20.0     # StochRSI K must be <= this (deeply oversold)
    # MACD gate (disabled by default)
    # Passes when: histogram < 0 AND MA(bar-to-bar histogram slope) > macd_slope_threshold
    macd_gate_enabled: false
    macd_fast: 12
    macd_slow: 26
    macd_signal_period: 9
    macd_slope_ma_period: 3      # number of consecutive slopes to average
    macd_slope_threshold: 0.0    # avg slope must exceed this (positive = converging toward 0)
    # Feature 1: Progress gate — exit if trade hasn't shown meaningful gain after N bars
    stale_exit_enabled: true
    stale_check_bars: 20          # bars held before stale check fires
    stale_min_gain_pct: 0.5       # best gain must have exceeded this % or we exit
    # Feature 2: Breakeven stop — move hard stop to entry once trigger_pct gain reached
    breakeven_stop_enabled: false
    breakeven_trigger_pct: 1.0    # % gain that arms the breakeven stop
    breakeven_buffer_pct: 0.0     # stop set to entry + this % (0 = exact breakeven)
    # Feature 3: Momentum decay exit — exit if model loses confidence in the bottom thesis
    momentum_exit_enabled: false
    momentum_exit_p_min_floor: 0.35   # P(local-min) below this triggers exit
    momentum_exit_min_bars: 5         # min bars held before momentum exit can fire


data:
  db_path: data/market.db
  historical_cache_days: 100
logging:
  level: WARNING
  dir: logs/
ui:
  enabled: true
  port: 8080
