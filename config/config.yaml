env: paper
candle_timeframe: 5minute
capital:
  total: 100000
  max_risk_per_trade_pct: 7.0
  daily_loss_limit_pct: 10.0
interested:
- NSE:INDHOTEL
- NSE:IDEA
- NSE:TECILCHEM


watchlist:
# - NSE:SUPREMEENG-BZ
# - NSE:OMKARCHEM-BZ
# - NSE:TECILCHEM
- NSE:GLOBALE
- NSE:RMDRIP
- NSE:MODTHREAD
- NSE:GTECJAINX
- NSE:GICL
# - NSE:MAHASTEEL-BE
- NSE:TECILCHEM
- NSE:SVLL
- NSE:VISASTEEL
- NSE:INFOMEDIA



strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 200
    threshold: 0.90
    profit_pct: 4.0
    stop_pct: 2
    hold_bars: 150
    retrain_every: 50
    extrema_order: 5
risk:
  gtt_enabled: false
  order_type: limit          # market | limit  (live mode only; paper always fills at next open)
  max_open_positions: 5
  default_sl_pct: 2
  risk_reward: 4
  max_capital_per_stock_pct: 20.0
data:
  db_path: data/market.db
  historical_cache_days: 90
logging:
  level: INFO
  dir: logs/
