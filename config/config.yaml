env: live
candle_timeframe: 15minute
capital:
  total: 30000 
  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 10
risk:
  gtt_enabled: false
  order_type: market          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 10
  default_sl_pct: 3
  risk_reward: 2.5
  max_capital_per_stock_pct: 15.0
interested:
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL


watchlist:
  - NSE:ATHERENERG
  - NSE:CUPID
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL
  - NSE:GUJALKALI




strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 300
    lookback_bars: 1200
    threshold: 0.85
    sell_threshold: 0.65
    extrema_order: 5
    profit_pct: 15
    trail_pct: 1.5
    sell_min_pct: 7.0
    hold_bars: 250           # max candles before time-based exit (extrema mode only)
    sl_cooldown_bars: 48     # bars to block re-entry after a hard SL hit (~5 calendar days on 15min)
    stop_pct: 10             # fallback if atr_stop_mult = 0
    atr_stop_mult: 7
    atr_period: 250          # relevant when extrema mode
    retrain_every: 25
    trading_start: "09:30"
    trading_end: "15:30"
    volume_ma_bars: 20
    model_type: "lr"
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.1
    label_mode: "extrema"
    # regression-mode params (inactive — uncomment when switching to forward_return)
    # label_horizon: 96
    # min_entry_return: 0.05
    # exit_return_floor: 0.0

data:
  db_path: data/market.db
  historical_cache_days: 50
logging:
  level: ERROR
  dir: logs/
ui:
  enabled: true
  port: 8080
