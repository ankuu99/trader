env: live
candle_timeframe: 15minute
capital:
  total: 10000
  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 7
risk:
  gtt_enabled: true
  order_type: limit          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 5
  default_sl_pct: 3
  risk_reward: 4
  max_capital_per_stock_pct: 10.0
interested:
- NSE:INDHOTEL
- NSE:IDEA
- NSE:TECILCHEM


watchlist:
- NSE:TOTAL
- NSE:SUZLON
- NSE:ENGINERSIN
- NSE:GODIGIT
- NSE:TECILCHEM
- NSE:GLOBALE
- NSE:RMDRIP
- NSE:MODTHREAD
- NSE:GTECJAINX
- NSE:GICL
- NSE:SVLL
- NSE:VISASTEEL
- NSE:INFOMEDIA

strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 200
    threshold: 0.90
    profit_pct: 4.0
    stop_pct: 2
    hold_bars: 150
    retrain_every: 50
    extrema_order: 5

data:
  db_path: data/market.db
  historical_cache_days: 50
logging:
  level: INFO
  dir: logs/
ui:
  enabled: true
  port: 8080
