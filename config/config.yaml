        enabled: true
        min_return_pct: 2.0
  NSE:BLUESTARCO:
    lr_extrema:
      threshold: 0.90
      forward_label:
        enabled: true
        min_return_pct: 2.5
  NSE:GUJALKALI:
    lr_extrema:
      threshold: 0.95
      forward_label:
        enabled: true
        min_return_pct: 2.5
  NSE:HAL:
    lr_extrema:
      threshold: 0.92
      forward_label:
        enabled: true
