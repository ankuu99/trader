env: live
candle_timeframe: 15minute
capital:
  total: 200000
  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 5
risk:
  gtt_enabled: false
  order_type: limit          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 10
  default_sl_pct: 3
  risk_reward: 2.5
  max_capital_per_stock_pct: 10.0
interested:
- NSE:ATHERENERG


watchlist:
- NSE:ATHERENERG
- NSE:SUZLON
- NSE:ENGINERSIN
- NSE:GODIGIT
- NSE:THYROCARE
- NSE:NATIONALUM
- NSE:INDIGO
- NSE:SAIL
- NSE:TARACHAND
- NSE:CUPID
- NSE:IDEA
- NSE:INDHOTEL


strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 300
    lookback_bars: 600
    threshold: 0.85
    profit_pct: 6
    trail_pct: 1.5
    stop_pct: 5
    hold_bars: 300
    retrain_every: 25
    extrema_order: 5
    trading_start: "09:30"
    trading_end: "15:30"

data:
  db_path: data/market.db
  historical_cache_days: 50
logging:
  level: INFO
  dir: logs/
ui:
  enabled: true
  port: 8080
