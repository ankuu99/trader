    enabled: false
    period: 21
    oversold: 30
    overbought: 65
    timeframe: 5minute
    midpoint: 50
  orb:
    enabled: false
    range_minutes: 15
    timeframe: 30minute
    volume_filter: true
    volume_lookback: 20
    volume_multiplier: 1.5
    gap_filter: true
    gap_pct: 2.0
  vwap:
    enabled: false
    min_deviation_pct: 0.75
  vwap_pullback:
    enabled: false
    sma_period: 30
    vwap_touch_tolerance_pct: 0.1
  supertrend:
    enabled: false
    period: 7
    factor: 3.0
  bollinger:
    enabled: false
    period: 15
    std: 3.0
  ema_pullback:
    enabled: false
    fast: 12
    slow: 100
  macd:
    enabled: false
    fast: 10
    slow: 30
    signal: 12
  macd_target:
    enabled: true
    rsi_period: 14
    rsi_oversold: 25
    fast: 12
    slow: 18
    signal: 9
    target_pct: 1
  macd_rsi:
    enabled: false
    rsi_period: 14
    rsi_oversold: 25
    rsi_midpoint: 70
    macd_fast: 9
    macd_slow: 18
    macd_signal: 7
  orb_supertrend:
    enabled: false
  orb_adx:
    enabled: false
  orb_ema_pullback:
