env: live
candle_timeframe: 15minute
capital:
  total: 30000 
  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 10
risk:
  gtt_enabled: false
  order_type: market          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 10
  default_sl_pct: 3
  risk_reward: 2.5
  max_capital_per_stock_pct: 15.0
interested:
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL


watchlist:
  - NSE:ATHERENERG
  - NSE:CUPID
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL
  - NSE:GUJALKALI




strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 300
    lookback_bars: 600
    threshold: 0.85
    profit_pct: 20
    trail_pct: 0.25
    sell_min_pct: 7.0
    sell_threshold: 0.80
    min_hold_before_exit: 1
    stop_pct: 20
    hold_bars: 400
    retrain_every: 25
    extrema_order: 5
    trading_start: "09:30"
    trading_end: "15:30"
    veto_threshold: 0.4
    volume_ma_bars: 20
    entry_min_volume_ratio: 2  # e.g. 1.3 — block if volume < 1.3x average                                                                                 
    entry_min_norm_price: 0.0     # e.g. 0.5 — block if close in lower half of candle range                                                                   
    entry_require_prior_decline: false  # true — block if 20-bar return slope is flat/rising     

data:
  db_path: data/market.db
  historical_cache_days: 50
logging:
  level: INFO
  dir: logs/
ui:
  enabled: true
  port: 8080
