strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 300
    lookback_bars: 1200
    threshold: 0.90               # min P(local-min) to enter
    veto_threshold: 1.0           # block entry if P(local-max) >= this
    retrain_every: 25             # 15m bars (~1.5 trading days). NB: the daily system
                                  # restart re-trains every model from scratch during
                                  # warm-up anyway — this only sets the INTRADAY cadence.
    extrema_order: 10

    # --- Exit stack (Stage 3: trader/policy/ExtremaExitPolicy) ---
    # Optional exits (stale / stale_2 / momentum_decay / breakeven) are enabled by the
    # *presence* of their block; omit a block to disable it.
    exits:
      hold_bars: 200              # candle-count time cap
      sell_min_pct: 3.0           # shared min-gain floor (pattern-top / momentum / trailing)
      hard_stop:
        stop_pct: 20              # hard stop-loss % from entry (also the entry SL hint)
      trailing:
        profit_pct: 7            # min profit % before trailing activates (Step 0: 5→10)
        trail_pct: 2              # trailing distance from peak — TIGHT, protects the small post-scale-out remainder (Step 2 best)
        force_close_time: "15:25" # force-close trailing positions before this time (None=off)
        pattern_top_floor_enabled: false  # if true, exit when gain drops below sell_min_pct
        # Step 1 (confidence-sized trailing) — OFF: validated worse than static loosening
        # (₹61k vs ₹74k). Trail distance would scale with P(max) when enabled.
        # confidence_sizing: { enabled: true, trail_loose: 6, trail_tight: 2, p_lo: 0.5, p_hi: 0.9 }
      pattern_top:
        sell_threshold: 0.85      # P(local-max) that arms pattern-top trailing / scale-out
        min_hold_before_exit: 1   # min bars held before pattern-top can fire
        # Step 2 (scale-out) — sell 70% at the detected top, trail the rest (tight).
        # ₹57k→₹110k on 2025-26, Calmar 1.13→2.63, win 50%→67%, DD 13.3%→10.7%.
        scale_out: { enabled: true, fraction: 0.5 }
      stale:                      # present = enabled (Progress gate tier 1)
        check_bars: 40            # 20→40 2026-07-06 — stale-runway ×2, beat baseline 4/4 half-year windows
        min_gain_pct: 0.5         # best gain must have exceeded this % or we exit
      stale_2:                    # present = enabled (faded after early promise)
        check_bars: 200           # 100→200 2026-07-06 — coincides with hold_bars, tier-2 defers to hold timeout at 15m
        min_gain_pct: -2.0        # current gain floor at tier-2 check
      # momentum_decay: { p_min_floor: 0.35, min_bars: 5 }   # absent = disabled
      # breakeven:      { trigger_pct: 1.0, buffer_pct: 0.0 } # absent = disabled

    # --- Entry gates (Stage 3: trader/policy/ExtremaEntryPolicy) ---
    # All disabled. Add a block to enable a gate (presence = enabled). Examples:
    entry_gates: {}
      # volume:    { min_ratio: 1.3 }                # block if volume_ratio < min_ratio
      # norm_price:{ min: 0.5 }                      # block if close in lower half of bar
      # prior_decline: {}                            # block if 20-bar return slope >= 0
      # trend:     { lookback: 800, min_return: -20.0 }  # block sustained downtrends
      # rsi:       { period: 14, max: 30.0 }
      # stoch_rsi: { period: 14, smooth_k: 3, max: 20.0 }
      # macd:      { fast: 12, slow: 26, signal_period: 9, slope_ma_period: 3, slope_threshold: 0.0 }

    # --- Fundamental model enhancements (nested, each has an enabled toggle) ---

    # Enhancement A: Forward-return labeling
    # Replaces geometric-minima labels with outcome-based labels: a local minimum is only
    # kept as a buy training sample if price actually rose >= min_return_pct over the next
    # forward_bars candles. Filters out minima that continued lower (false bottoms).
    # When disabled: identical to baseline behaviour.
    forward_label:
      enabled: false
      forward_bars: 150             # bars forward to measure outcome (~5 trading days at 15min)
      min_return_pct: 1.5           # min % rise required to keep as a class-0 label

    # Primary training labels (Stage 4 Labeler). type: extrema (default, fixed
    # ±extrema_order neighbourhood) | trend_scan (Phase 3b: dynamic horizon — fits
    # forward regressions over min_bars..max_bars and keeps the max-|t-stat| trend).
    labels:
      type: extrema
      trend_scan:
        min_bars: 10
        max_bars: 60
        t_threshold: 2.0
      # Neutral class — adds class-2 "neither" training samples drawn ≥ margin_bars
      # away from every geometric extremum (deterministic, evenly spaced; ratio =
      # neutrals per extremum sample). Fixes the forced P(min)+P(max)=1 split that
      # makes ordinary hard-falling candles read as near-certain minima (the live
      # FP problem — see neutral_class_learnings.md). Changes P(min)/P(max) scale:
      # thresholds MUST be recalibrated before enabling in live.
      neutral:
        enabled: false
        ratio: 1.0
        margin_bars: null           # null => extrema_order

    # --- Model config (Stage 2: trader/models) ---
    # Swappable classifier behind the ExtremaModel interface. Only `logistic` is
    # registered today; kNN/GBM/MLP land in Stage 4 (need pooled training first).
    model:
      type: logistic

    # --- Feature pipeline config (Stage 1: trader/features/ExtremaFeaturePipeline) ---
    # Base vector is always [volume_ratio, norm_price, slope3/5/10/20]; depth and macd
    # are optional add-ons. When an add-on is disabled the vector is unchanged.
    features:
      volume_ma_bars: 20            # rolling window for volume_ratio normalisation

      # Depth-of-decline — adds drawdown_from_high (7th feature): how far price has fallen
      # from its recent high (close - max_close_over_lookback) / max_close_over_lookback.
      # Deeper declines from a higher base are stronger reversal candidates.
      depth:
        enabled: true
        lookback_bars: 50           # bars back to find the recent high

      # MACD features — adds macd_hist_norm (histogram / price) and macd_hist_slope (linreg
      # slope of last hist_lookback histogram values / price). Captures medium-term momentum
      # the short-term return slopes miss (decaying-positive = top, recovering-negative = bottom).
      macd:
        enabled: false
        fast: 12
        slow: 26
        signal_period: 9
        hist_lookback: 3

      # Drawdown curvature — anchors at the swing high (t0) within lookback_bars, then
      # splits the decline (t0..now) in half and returns slope(recent_half) - slope(older_half)
      # over % returns. > 0 = the decline is decelerating / bending up (bottoming signal);
      # < 0 = the decline is still accelerating. One stable scalar (drawdown_curvature).
      # TESTED 2026-07-01 on 2026-YTD: robustly WORSE than baseline at every lookback
      # (27.1% → 24.3%/23.3%/20.3% for lb 30/50/100). Kept disabled.
      curvature:
        enabled: false
        lookback_bars: 50           # window to locate the swing high (t0)

    # --- Meta-labeling precision gate (secondary model) ---
    # A secondary classifier that, after the primary fires a candidate entry, predicts
    # P(this trade hits profit before stop/time) and vetoes low-confidence firings.
    # Trained on the primary's historical firings via triple-barrier outcome labels.
    # Off by default (parity-preserving). See meta_labeling_plan.md.
    meta_label:
      enabled: false                   # FINALIZED deploy candidate (meta@0.55 + cap20 + per-stock). NOTE: needs prod cadence/frozen-artifact work before live (t2.micro warm-up cost).
      meta_threshold: 0.55            # min P(win) to allow the entry
      sizing:                         # Phase 2: confidence sizing — qty scaled by P(win)
        enabled: false                # when off, the gate is binary (full size)
        min_fraction: 0.5             # qty multiplier at p_win == meta_threshold
        max_fraction: 1.0             # qty multiplier at p_win == 1.0 (>1 = lever up high-conviction)
      model:
        type: xgboost                 # xgboost | logistic (logistic = leakage canary)
        max_depth: 3
        n_estimators: 100
        min_child_weight: 5
        reg_lambda: 1.0
      features:
        vol_bars: 20
        rsi_period: 14
        depth_bars: 50
        include_primary_scores: true
      barriers:                       # null => inherit from exits: (profit/stop/hold_bars)
        profit_pct: null
        stop_pct: null
        max_bars: null
        # Phase 3a: volatility-scaled barriers. Set atr_mult_pt/atr_mult_sl to use
        # entry ± mult·ATR for that side instead of the % barrier (null => use %).
        atr_mult_pt: null
        atr_mult_sl: null
        atr_period: 14


per_stock_params:
  # forward_label filters false-bottom training samples for stocks where the
  # default geometric-minima labels produce noisy signals.
  # Only "more selective" overrides here — overrides that reduce noise rather
  # than increase trade frequency (lowering threshold hurts portfolio via capital competition).
  # ATHERENERG — structurally trending recent IPO. Exit-side trend guard suppresses the
  # pattern-top exit while price is in a clean uptrend (acceleration-based features misread
  # a trending leg as a top). Backtest 2025-05→2026-06: +32% standalone, +Rs6.3k in-portfolio,
  # lower drawdown. Guard is per-stock only — it hurts mean-reverting names (e.g. GAYAPROJ-BE).
  # IPCALAB — DAY-timeframe swing trading (bars aggregated 09:15–15:15 from 15m
  # base candles; decisions ~15:15, same-day entry — docs/Aggregated_Timeframes_Design.md).
  # Fundamentally qualified 2026-06-30 (reviews/qualify_IPCALAB_20260630.md).
  # Every TF-sensitive param is overridden — the global values are 15m-calibrated.
  # STARTING POINTS ONLY, not calibrated. Before trusting results:
  #   python scripts/calibrate.py --from 2024-01-01 --strategy-timeframe day \
  #       --params threshold stop_pct trail_pct hold_bars sell_threshold
  # (needs ~2.4yr of 15m cache — first fetch requires a live Kite session)
  NSE:IPCALAB:
    lr_extrema:
      timeframe: day
      warmup_bars: 100              # ~5 months of day bars before first training
      lookback_bars: 400            # ~19-month rolling training window
      retrain_every: 1              # retrain every day bar — replicates what the daily
                                    # system restart already does (fresh warm-up retrain
                                    # each morning); keeps backtest == live behaviour
      extrema_order: 3              # swing extrema = local min/max over ±3 days
      exits:
        hold_bars: 40               # ~2 months max hold
        sell_min_pct: 7.0
        hard_stop:
          stop_pct: 20              # black-swan circuit breaker (same philosophy as 15m)
        trailing:
          profit_pct: 10            # trailing arms at +10%
          trail_pct: 4              # 2% would exit on ordinary daily noise
          force_close_time: null    # EOD force-close is a 15m-regime rule; day-TF holds must survive overnight
        pattern_top:
          sell_threshold: 0.85
          min_hold_before_exit: 2   # days
        stale:
          check_bars: 30           # 15→30 2026-07-06 (stale-runway ×2, 4/4 windows)
          min_gain_pct: 0.5
        stale_2:
          check_bars: 70           # 35→70 2026-07-06 — above hold_bars 40, tier-2 defers to hold timeout
          min_gain_pct: -2.0
      features:
        volume_ma_bars: 20          # 20-day volume normalisation
