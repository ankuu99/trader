  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 10
risk:
  gtt_enabled: false
  order_type: market          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 25
  compounding: true            # true → per-stock cap scales with base_capital + strategy cumulative P&L
  default_sl_pct: 3
  risk_reward: 2.5
  max_capital_per_stock_pct: 10.0   # deploy candidate (validated ONLY paired with meta_label.enabled)
  trading_start: "09:15"      # no ENTRY signals accepted before this time (IST)
  trading_end: "15:30"        # no ENTRY signals accepted after this time (IST)
scale_in:                     # portfolio-level geometric add-ons (validated 2026-07-07 counterfactual)
  enabled: false                # master switch — enable in paper first
  fraction_pct: 50            # add-on notional = this % of the PREVIOUS lot's notional
  max_addons: 2               # max add-on lots per position
  min_spacing_days: 1         # add-on must fill >= this many calendar days after last investment
  budget_pct: 10              # scale-in pool = this % of capital.total, ON TOP of base capital
