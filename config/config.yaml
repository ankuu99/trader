env: live
candle_timeframe: 15minute
capital:
  total: 300000 
  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 10
risk:
  gtt_enabled: false
  order_type: market          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 12
  default_sl_pct: 3
  risk_reward: 2.5
  max_capital_per_stock_pct: 5.0
  trading_start: "09:30"      # no ENTRY signals accepted before this time (IST)
  trading_end: "15:30"        # no ENTRY signals accepted after this time (IST)
interested:
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL


watchlist:
  # --- Original ---
  - NSE:ATHERENERG
  - NSE:CUPID
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL
  - NSE:GUJALKALI
  # --- Expanded (screener.in validated, May 2026) ---
  - NSE:ICICIBANK
  - NSE:BAJFINANCE
  - NSE:HDFCAMC
  - NSE:PERSISTENT
  - NSE:BHARTIARTL
  - NSE:LUPIN
  - NSE:POLYCAB
  - NSE:CUMMINSIND
  - NSE:ABB
  - NSE:DMART
  - NSE:PIDILITIND
  - NSE:WAAREEENER
  - NSE:COFORGE
  - NSE:KOTAKBANK
  - NSE:TATAPOWER




strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 300
    lookback_bars: 1200
    threshold: 0.90
    profit_pct: 7
    trail_pct: 1.5
    sell_min_pct: 7.0
    sell_threshold: 0.60
    min_hold_before_exit: 1
    stop_pct: 10
    hold_bars: 400
    retrain_every: 25
    extrema_order: 10
    veto_threshold: 0.5
    volume_ma_bars: 20
    entry_min_volume_ratio: 0  # e.g. 1.3 — block if volume < 1.3x average
    entry_min_norm_price: 0.0     # e.g. 0.5 — block if close in lower half of candle range
    entry_require_prior_decline: false  # true — block if 20-bar return slope is flat/rising

data:
  db_path: data/market.db
  historical_cache_days: 100
logging:
  level: WARNING
  dir: logs/
ui:
  enabled: true
  port: 8080
