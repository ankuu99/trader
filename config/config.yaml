  rsi_bollinger:
    enabled: false
  rsi_supertrend:
    enabled: false
  rsi_vwap:
    enabled: false
  vwap_pullback_adx:
    enabled: false
  ema_pullback_adx:
    enabled: false
  adx:
    period: 20
    threshold: 20
risk:
  max_open_positions: 10
  default_sl_pct: 5.0
  weekly_loss_limit_pct: 10
  regime_filter:
    enabled: false
    index_symbol: NSE:NIFTY 50
    dma_period: 200
    max_drawdown_pct: 15.0
  position_sizing:
    atr_based: false
    atr_multiplier: 2.0
    max_position_pct: 20.0
  trailing_stop:
    enabled: false
    period: 10
    multiplier: 2.0
data:
  db_path: data/market.db
  historical_cache_days: 90
logging:
  level: INFO
  dir: logs/
