strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 300
    lookback_bars: 1200
    threshold: 0.90               # min P(local-min) to enter
    veto_threshold: 1.0           # block entry if P(local-max) >= this
    retrain_every: 25
    extrema_order: 10

    # --- Exit stack (Stage 3: trader/policy/ExtremaExitPolicy) ---
    # Optional exits (stale / stale_2 / momentum_decay / breakeven) are enabled by the
    # *presence* of their block; omit a block to disable it.
    exits:
      hold_bars: 200              # candle-count time cap
      sell_min_pct: 3.0           # shared min-gain floor (pattern-top / momentum / trailing)
      hard_stop:
        stop_pct: 20              # hard stop-loss % from entry (also the entry SL hint)
      trailing:
        profit_pct: 5             # min profit % before trailing activates
        trail_pct: 2              # trailing distance % from peak
        force_close_time: "15:25" # force-close trailing positions before this time (None=off)
        pattern_top_floor_enabled: false  # if true, exit when gain drops below sell_min_pct
      pattern_top:
        sell_threshold: 0.85      # P(local-max) that arms pattern-top trailing
        min_hold_before_exit: 1   # min bars held before pattern-top can fire
      stale:                      # present = enabled (Progress gate tier 1)
        check_bars: 20
        min_gain_pct: 0.5         # best gain must have exceeded this % or we exit
      stale_2:                    # present = enabled (faded after early promise)
        check_bars: 100
        min_gain_pct: -2.0        # current gain floor at tier-2 check
      # momentum_decay: { p_min_floor: 0.35, min_bars: 5 }   # absent = disabled
      # breakeven:      { trigger_pct: 1.0, buffer_pct: 0.0 } # absent = disabled

    # --- Entry gates (Stage 3: trader/policy/ExtremaEntryPolicy) ---
    # All disabled. Add a block to enable a gate (presence = enabled). Examples:
    entry_gates: {}
      # volume:    { min_ratio: 1.3 }                # block if volume_ratio < min_ratio
      # norm_price:{ min: 0.5 }                      # block if close in lower half of bar
      # prior_decline: {}                            # block if 20-bar return slope >= 0
      # trend:     { lookback: 800, min_return: -20.0 }  # block sustained downtrends
      # rsi:       { period: 14, max: 30.0 }
      # stoch_rsi: { period: 14, smooth_k: 3, max: 20.0 }
      # macd:      { fast: 12, slow: 26, signal_period: 9, slope_ma_period: 3, slope_threshold: 0.0 }

    # --- Fundamental model enhancements (nested, each has an enabled toggle) ---

    # Enhancement A: Forward-return labeling
    # Replaces geometric-minima labels with outcome-based labels: a local minimum is only
    # kept as a buy training sample if price actually rose >= min_return_pct over the next
    # forward_bars candles. Filters out minima that continued lower (false bottoms).
    # When disabled: identical to baseline behaviour.
    forward_label:
      enabled: false
      forward_bars: 150             # bars forward to measure outcome (~5 trading days at 15min)
      min_return_pct: 1.5           # min % rise required to keep as a class-0 label

    # --- Model config (Stage 2: trader/models) ---
    # Swappable classifier behind the ExtremaModel interface. Only `logistic` is
    # registered today; kNN/GBM/MLP land in Stage 4 (need pooled training first).
    model:
      type: logistic

    # --- Feature pipeline config (Stage 1: trader/features/ExtremaFeaturePipeline) ---
    # Base vector is always [volume_ratio, norm_price, slope3/5/10/20]; depth and macd
    # are optional add-ons. When an add-on is disabled the vector is unchanged.
    features:
      volume_ma_bars: 20            # rolling window for volume_ratio normalisation

      # Depth-of-decline — adds drawdown_from_high (7th feature): how far price has fallen
      # from its recent high (close - max_close_over_lookback) / max_close_over_lookback.
      # Deeper declines from a higher base are stronger reversal candidates.
      depth:
        enabled: true
        lookback_bars: 50           # bars back to find the recent high

      # MACD features — adds macd_hist_norm (histogram / price) and macd_hist_slope (linreg
      # slope of last hist_lookback histogram values / price). Captures medium-term momentum
      # the short-term return slopes miss (decaying-positive = top, recovering-negative = bottom).
      macd:
        enabled: false
        fast: 12
        slow: 26
        signal_period: 9
        hist_lookback: 3


per_stock_params:
  # forward_label filters false-bottom training samples for stocks where the
  # default geometric-minima labels produce noisy signals.
  # Only "more selective" overrides here — overrides that reduce noise rather
  # than increase trade frequency (lowering threshold hurts portfolio via capital competition).
  NSE:GOKEX:
    lr_extrema:
      forward_label:
        enabled: true
        min_return_pct: 2.0
  NSE:M&MFIN:
    lr_extrema:
      threshold: 0.92
  NSE:INDUSTOWER:
    lr_extrema:
      threshold: 0.88
      forward_label:
        enabled: true
        min_return_pct: 1.0
  NSE:RADICO:
    lr_extrema:
      threshold: 0.92
  NSE:TVSMOTOR:
    lr_extrema:
