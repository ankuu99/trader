env: live
candle_timeframe: 15minute
capital:
  total: 300000 
  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 10
risk:
  gtt_enabled: false
  order_type: market          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 20
  default_sl_pct: 3
  dd_circuit_breaker_pct: 20  # halt new entries when portfolio DD > 20% from equity peak
  dd_resume_pct: 15           # resume when equity recovers to < 15% DD from peak
  dd_cooldown_days: 60        # after tripping, reset peak to current equity after this many calendar days
  risk_reward: 2.5
  max_capital_per_stock_pct: 5.0
interested:
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL


watchlist:
  # Original 7
  - NSE:ATHERENERG
  - NSE:CUPID
  - NSE:DCXINDIA
  - NSE:GOKEX
  - NSE:ABFRL
  - NSE:COROMANDEL
  - NSE:GUJALKALI
  # Pharma
  - NSE:LAURUSLABS
  - NSE:GRANULES
  - NSE:JBCHEPHARM
  # Banking
  - NSE:FEDERALBNK
  # FMCG
  - NSE:MARICO
  # Telecom infra
  - NSE:HFCL
  # Metals / Steel
  - NSE:JINDALSTEL
  # Capital goods / Electrical
  - NSE:CGPOWER
  # Auto ancillary
  - NSE:MSUMI
  # Auto / Tyres
  - NSE:BALKRISIND
  # IT services
  - NSE:COFORGE
  # Power / Sponge iron
  - NSE:GPIL




strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 300
    lookback_bars: 1200
    threshold: 0.85
    sell_threshold: 0.8
    extrema_order: 10
    profit_pct: 8
    trail_pct: 1.5
    sell_min_pct: 7.0
    hold_bars: 250           # max candles before time-based exit (extrema mode only)
    sl_cooldown_bars: 16     # bars to block re-entry after a hard SL hit (~1 calendar day on 15min)
    stop_pct: 10             # fallback if atr_stop_mult = 0
    atr_period: 250          # relevant when extrema mode
    retrain_every: 25
    trading_start: "09:30"
    trading_end: "15:30"
    volume_ma_bars: 20
    model_type: "lr"
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.1
    label_mode: "extrema"
    # A1: ATR-based trailing — DISABLED (trail_activate_atr=0 uses profit_pct/trail_pct fallback)
    trail_atr_period: 14
    trail_activate_atr: 0.0
    trail_give_back_atr: 0.0
    # A2: Stagnation exit — exit dead trades that don't move 1 ATR in M bars
    stagnation_bars: 60        # bars of no ATR-sized move before exit check
    stagnation_atr_mult: 1.0   # move threshold in ATR units
    stagnation_peak_atr_min: 2.0  # only exit if peak never reached 2 ATR (~1% for most stocks)
    # A3: Peak give-back exit — exit when gain gives back 50% from peak (min peak=5%)
    peak_give_back_min_gain_pct: 5.0
    peak_give_back_fraction: 0.5
    # B1: Trend filter — no entries below EMA50
    entry_ema_filter_period: 50
    # C6: Feature pruning — top 4 by XGB importance (norm_price, slope5, slope10, ema20_dist)
    feature_indices: [1, 3, 4, 8]
    # C7: Lagged features — append t-1 and t-2 feature vectors to give model trajectory context
    feature_lag_periods: [1, 2]
    # D1: ATR-scaled stop — DISABLED (keep stop_pct=10 for now)
    atr_stop_mult: 0
    # regression-mode params (inactive — uncomment when switching to forward_return)
    # label_horizon: 96
    # min_entry_return: 0.05
    # exit_return_floor: 0.0

data:
  db_path: data/market.db
  historical_cache_days: 100
logging:
  level: ERROR
  dir: logs/
ui:
  enabled: true
  port: 8080
