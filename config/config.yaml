env: live
candle_timeframe: 5minute
capital:
  total: 5000
  max_risk_per_trade_pct: 5.0
  daily_loss_limit_pct: 5
risk:
  gtt_enabled: true
  order_type: market          # market | limit  (live mode only; paper always fills at next open)
  market_protection_pct: 1.0  # % buffer added to MARKET orders (Zerodha API requirement)
  max_open_positions: 5
  default_sl_pct: 2
  risk_reward: 4
  max_capital_per_stock_pct: 15.0
interested:
- NSE:INDHOTEL
- NSE:IDEA
- NSE:TECILCHEM


watchlist:
# - NSE:SUPREMEENG-BZ
# - NSE:OMKARCHEM-BZ
# - NSE:TECILCHEM
- NSE:GLOBALE
- NSE:RMDRIP
- NSE:MODTHREAD
- NSE:GTECJAINX
- NSE:GICL
# - NSE:MAHASTEEL-BE
- NSE:TECILCHEM
- NSE:SVLL
- NSE:VISASTEEL
- NSE:INFOMEDIA



strategies:
  lr_extrema:
    enabled: true
    warmup_bars: 200
    threshold: 0.90
    profit_pct: 4.0
    stop_pct: 2
    hold_bars: 150
    retrain_every: 50
    extrema_order: 5

data:
  db_path: data/market.db
  historical_cache_days: 20
logging:
  level: INFO
  dir: logs/
ui:
  enabled: true
  port: 8080
