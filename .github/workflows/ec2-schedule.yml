# Starts the trader EC2 box every trading morning and stops it as a backup.
#
# Primary stop is ON the box (scripts/trader-poweroff.timer, 16:00 IST); the
# 16:30 IST stop here is a belt-and-braces backup (idempotent if already
# stopped). Start can only come from outside the box — this is it.
# GitHub cron is best-effort (can lag 5–15 min at busy hours), hence 06:45 IST
# for a 07:00 target; nothing in the bot needs the box before the 08:15 cron.
#
# Manual use (Actions → "EC2 schedule" → Run workflow): start the box for an
# evening release, then stop it — or let the box's own 23:55 timer do it.
#
# Secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (IAM user with
# ec2:StartInstances / StopInstances / DescribeInstances on this instance).
# Public repo: secrets are never exposed to fork PRs; only pushes by the owner
# can change this file. GitHub disables schedules after 60 days with no commits.

name: EC2 schedule

on:
  schedule:
    - cron: "15 1 * * 1-5"   # 06:45 IST Mon–Fri → start
    - cron: "0 11 * * 1-5"   # 16:30 IST Mon–Fri → backup stop
  workflow_dispatch:
    inputs:
      action:
        description: "start | stop | status"
        type: choice
        required: true
        default: status
        options: [start, stop, status]

permissions: {}

concurrency:
  group: ec2-schedule
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-04c3a635ebb6455e2
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  ec2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decide action
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            action="$INPUT_ACTION"
          elif [ "$SCHEDULE" = "15 1 * * 1-5" ]; then
            action=start
          else
            action=stop
          fi
          echo "action=$action" | tee -a "$GITHUB_OUTPUT"

      - name: Run
        env:
          ACTION: ${{ steps.decide.outputs.action }}
        run: |
          set -euo pipefail
          state() {
            aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].[State.Name,PublicIpAddress]' --output text
          }
          echo "before: $(state)"
          case "$ACTION" in
            start)
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              ;;
            stop)
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              ;;
            status) ;;
            *) echo "unknown action: $ACTION" >&2; exit 1 ;;
          esac
          echo "after:  $(state)"
